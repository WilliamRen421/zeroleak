# One run of the pipeline.  Every number in the paper's Table 1 for Volve
# 15/9-19A is reproduced from this file plus data/volve_15_9_19a.csv.

seed: 20261007
phases: 3

window:
  phi_min: 0.02
  phi_max: 0.45

cutpoints:
  rule: prior          # the boundaries below are fixed before any target is read
  values: [0.10, 0.20]

folds:
  rule: depth_block
  n_blocks: 5

strategies:
  - prior
  - target_terciles

# Written to out/, never to expected/.  expected/ is the reference produced by a
# tagged commit and is only ever read; if a run wrote there, it would overwrite the
# very number it is supposed to be checked against.  `python -m zeroleak verify`
# runs this file into out/verify and diffs the result against expected/.
output_dir: out/base

bodies:
  - name: volve_15_9_19a
    file: data/volve_15_9_19a.csv
    columns:
      phi: phi
      perm: kh_md
      depth: depth_m
    phi_scale: 1.0
